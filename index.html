<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5b41">
<meta name="description" content="Al-Qur'an 30 juz + terjemahan Bahasa Indonesia, berjalan penuh offline sebagai aplikasi web (PWA).">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Quran Offline — Al-Qur'an dan Terjemahan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-ar" aria-hidden="true">القرآن</span>
    <span>Quran&nbsp;Offline</span>
  </a>
  <div class="top-actions">
    <button id="btn-install" class="ghost hide" title="Pasang aplikasi">
      <svg viewBox="0 0 24 24"><path d="M12 3v10m0 0l-3.5-3.5M12 13l3.5-3.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <button id="btn-theme" class="ghost" title="Ganti tema" aria-label="Ganti tema terang/gelap">
      <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M5 19l1.7-1.7M17.3 6.7L19 5"/></svg>
      <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5z" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div id="player" class="player hide" aria-live="polite">
  <div class="prow">
    <button id="p-prev" title="Ayat sebelumnya"><svg viewBox="0 0 24 24"><path d="M7 5v14M20 5l-9 7 9 7z"/></svg></button>
    <button id="p-play" class="p-main" title="Putar/Jeda"><svg viewBox="0 0 24 24" class="i-pause"><path d="M9 5v14M15 5v14"/></svg><svg viewBox="0 0 24 24" class="i-play"><path d="M8 5l11 7-11 7z"/></svg></button>
    <button id="p-next" title="Ayat berikutnya"><svg viewBox="0 0 24 24"><path d="M17 5v14M4 5l9 7-9 7z"/></svg></button>
    <div class="pmeta">
      <b id="p-label">—</b>
      <div class="pseek"><span id="p-cur">0:00</span>
        <input id="p-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Progres audio">
        <span id="p-dur">0:00</span>
      </div>
    </div>
    <button id="p-stop" title="Berhenti"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<nav class="bottomnav">
  <a href="#/" data-nav="home">
    <svg viewBox="0 0 24 24"><path d="M4 20v-9l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>Beranda</span>
  </a>
  <a href="#/q/" data-nav="q">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Cari</span>
  </a>
  <a href="#/b" data-nav="b">
    <svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg><span>Tanda</span>
    <i id="mark-badge" class="badge hide">0</i>
  </a>
  <a href="#/t" data-nav="t">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg><span>Setelan</span>
  </a>
</nav>

<div id="toast" class="toast" role="status"></div>

<noscript><p style="padding:2rem;text-align:center">Aplikasi ini membutuhkan JavaScript.</p></noscript>

<script src="data/quran-data.js"></script>
<script src="app.js"></script>
</body>
</html>
